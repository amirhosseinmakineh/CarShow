<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>کاتالوگ خودروها | مدیریت CarShow</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color-scheme:light}body{margin:0;background:#f5f7fb;color:#17243a}main{max-width:1180px;margin:36px auto;padding:0 18px}h1{font-size:26px}p{color:#53657c}.panel{background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 4px 20px #1d32510b}.controls{display:flex;flex-wrap:wrap;gap:10px}input,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px}input{flex:1;min-width:180px}button{background:#1d4ed8;color:#fff;cursor:pointer;border:0}button:disabled{opacity:.5}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:15px;background:#f1f5fb;border-radius:10px}.stat strong{display:block;font-size:25px;margin-top:6px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:right;padding:12px;border-bottom:1px solid #e7ebf1}th{background:#f8fafc}.yes{color:#137c43}.no{color:#b45309}.pagination{display:flex;gap:10px;align-items:center;margin-top:16px}#status{min-height:24px}
</style>
</head>
<body><main>
<h1>کاتالوگ خودروهای دیتابیس</h1>
<p>نمایش مستقیم خودروهای ثبت‌شده در SQL Server و وضعیت ورود هر خودرو به مقایسه تلگرام. اطلاعات شرکت اختیاری است.</p>
<section class="panel"><div class="controls">
<input id="token" type="password" autocomplete="off" placeholder="توکن JWT مدیر (فقط در حافظه این صفحه)">
<input id="search" placeholder="جست‌وجوی خودرو، مدل، تیپ یا شرکت">
<button id="load">نمایش کاتالوگ</button>
</div><p id="status" role="status"></p></section>
<section class="panel stats" id="stats"></section>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>نام خودرو</th><th>شرکت</th><th>مدل</th><th>تیپ</th><th>قابل مقایسه</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><button id="prev">قبلی</button><span id="page"></span><button id="next">بعدی</button></div></section>
</main><script>
(() => {
 const el = id => document.getElementById(id);
 let page=0, count=0, size=50;
 const cell=(row,value)=>{const td=document.createElement('td');td.textContent=value==null?'—':String(value);row.appendChild(td);return td};
 async function load(){
  const token=el('token').value.trim();
  if(!token){el('status').textContent='برای مشاهده داده‌ها توکن JWT معتبر وارد کنید.';return}
  el('status').textContent='در حال دریافت اطلاعات…';
  try{
   const params=new URLSearchParams({pageNumber:page,pageSize:size,search:el('search').value.trim()});
   const response=await fetch('/api/admin/catalog?'+params,{headers:{Authorization:'Bearer '+token}});
   if(!response.ok)throw new Error(response.status===401?'توکن نامعتبر یا منقضی شده است':response.status===403?'دسترسی مجاز نیست':'خطای سرور: '+response.status);
   const data=await response.json();
   count=data.filteredCount;
   el('stats').replaceChildren();
   for(const [label,value] of [['کل خودروها',data.totalCars],['قابل مقایسه',data.eligibleCars],['فاقد مدل یا تیپ',data.excludedCars],['فاقد شرکت',data.missingCompany]]){
    const box=document.createElement('div');box.className='stat';box.textContent=label;
    const strong=document.createElement('strong');strong.textContent=Number(value).toLocaleString('fa-IR');box.appendChild(strong);el('stats').appendChild(box);
   }
   el('rows').replaceChildren();
   for(const car of data.items){
    const tr=document.createElement('tr');
    for(const value of [car.id,car.name,car.company,car.model,car.tip])cell(tr,value);
    const status=cell(tr,car.eligibleForTelegramComparison?'بله':'خیر');
    status.className=car.eligibleForTelegramComparison?'yes':'no';
    el('rows').appendChild(tr);
   }
   el('page').textContent='صفحه '+(page+1).toLocaleString('fa-IR')+' از '+Math.max(1,Math.ceil(count/size)).toLocaleString('fa-IR');
   el('prev').disabled=page===0;el('next').disabled=(page+1)*size>=count;
   el('status').textContent=count.toLocaleString('fa-IR')+' رکورد مطابق جست‌وجو';
  }catch(err){el('status').textContent=err.message}
 }
 el('load').onclick=()=>{page=0;load()};
 el('search').addEventListener('keydown',e=>{if(e.key==='Enter'){page=0;load()}});
 el('prev').onclick=()=>{if(page>0){page--;load()}};
 el('next').onclick=()=>{if((page+1)*size<count){page++;load()}};
})();
</script></body></html>
