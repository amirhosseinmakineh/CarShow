name: Research Iranian car trim catalog
on:
  workflow_dispatch:
  push:
    branches:
      - codex/telegram-price-reference-model-year-trim
    paths:
      - tools/research_iran_car_catalog.py
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Collect source catalog
        run: python tools/research_iran_car_catalog.py --delay 0.5 --nemuda-only
      - name: Upload audit and catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iran-car-trims-research
          path: |
            CarShow/Data/Research/iran-car-trim-catalog-expanded.*
            CarShow/Data/Research/iran-car-trim-research-audit.json
      - name: Commit research output (not production)
        if: success()
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add CarShow/Data/Research/iran-car-trim-catalog-expanded.* CarShow/Data/Research/iran-car-trim-research-audit.json
          if ! git diff --staged --quiet; then
            git commit -m 'Research: refresh source-linked trim catalog [skip ci]'
            git push
          fi
