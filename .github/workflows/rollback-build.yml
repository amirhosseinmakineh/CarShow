name: Backend build and scanner checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build CarShow.slnx --configuration Release
      - run: dotnet build tests/TelegramCarScanner.Tests/TelegramCarScanner.Tests.csproj --configuration Release
      - run: dotnet run --project tests/TelegramCarScanner.Tests/TelegramCarScanner.Tests.csproj --configuration Release --no-build --no-restore
